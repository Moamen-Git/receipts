name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare clean build folder
        run: |
          test -f index.html || { echo "index.html is missing at the top of the repository"; exit 1; }
          rm -rf build
          mkdir -p build/web
          cp index.html build/web/index.html

      - name: Setup Capacitor
        working-directory: build
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "دفتر الوصولات" com.moamen.receipts --web-dir web

      - name: Create Android project
        working-directory: build
        run: npx cap add android

      - name: Allow camera access
        working-directory: build
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Sync web files
        working-directory: build
        run: npx cap sync android

      - name: Build debug APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: receipts-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
