name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          SRC=index.html
          [ -f "$SRC" ] || SRC=www/index.html
          rm -rf web && mkdir web && cp "$SRC" web/index.html

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Allow camera access
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: receipts-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
