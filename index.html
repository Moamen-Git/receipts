<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>دفتر الوصولات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#0F1B3D; --muted:#5A6684; --line:#DCE2F0;
  --accent:#2B59E0; --accent-ink:#FFFFFF; --soft:#E9EEFD; --danger:#C62828; --overlay:rgba(10,18,45,.55);
  --stub-bg:#172554; --stub-ink:#FFFFFF; --stub-sub:#FBBF24;
  --f-display:'Cairo','IBM Plex Sans Arabic',system-ui,Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#131A33; --ink:#E8ECFA; --muted:#9AA6C9; --line:#243056;
    --accent:#7EA2FF; --accent-ink:#0B1430; --soft:#1B2748; --danger:#FF8F85; --overlay:rgba(0,0,0,.6);
    --stub-bg:#1E2B5C; --stub-ink:#FFFFFF; --stub-sub:#FBBF24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#131A33; --ink:#E8ECFA; --muted:#9AA6C9; --line:#243056;
  --accent:#7EA2FF; --accent-ink:#0B1430; --soft:#1B2748; --danger:#FF8F85; --overlay:rgba(0,0,0,.6);
  --stub-bg:#1E2B5C; --stub-ink:#FFFFFF; --stub-sub:#FBBF24;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 10px}
.top h1{font:800 24px/1.2 var(--f-display);margin:0}
.meta{margin:2px 0 12px;color:var(--muted);font-size:14px;min-height:21px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:50px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;padding:12px 0}
.search input::placeholder{color:var(--muted)}
.clear{flex:none;border:0;background:var(--soft);color:var(--muted);
