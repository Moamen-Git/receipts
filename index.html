<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>دفتر الوصولات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sticky search on top, receipt "stubs" grouped by month, fixed capture bar at the bottom, bottom sheet for add/edit. RTL. */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#0F1B3D; --muted:#5A6684; --line:#DCE2F0;
  --accent:#2B59E0; --accent-ink:#FFFFFF; --soft:#E9EEFD; --danger:#C62828; --overlay:rgba(10,18,45,.55);
  --stub-bg:#172554; --stub-ink:#FFFFFF; --stub-sub:#FBBF24;
  --f-display:'Cairo','IBM Plex Sans Arabic',system-ui,Tahoma,sans-serif;
  --f-body:'IBM Plex Sans Arabic',system-ui,Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1020; --surface:#131A33; --ink:#E8ECFA; --muted:#9AA6C9; --line:#243056;
    --accent:#7EA2FF; --accent-ink:#0B1430; --soft:#1B2748; --danger:#FF8F85; --overlay:rgba(0,0,0,.6);
    --stub-bg:#1E2B5C; --stub-ink:#FFFFFF; --stub-sub:#FBBF24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#131A33; --ink:#E8ECFA; --muted:#9AA6C9; --line:#243056;
  --accent:#7EA2FF; --accent-ink:#0B1430; --soft:#1B2748; --danger:#FF8F85; --overlay:rgba(0,0,0,.6);
    --stub-bg:#1E2B5C; --stub-ink:#FFFFFF; --stub-sub:#FBBF24;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 10px}
.top h1{font:800 24px/1.2 var(--f-display);margin:0}
.meta{margin:2px 0 12px;color:var(--muted);font-size:14px;min-height:21px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:50px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;padding:12px 0}
.search input::placeholder{color:var(--muted)}
.clear{flex:none;border:0;background:var(--soft);color:var(--muted);width:28px;height:28px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer}

.month{margin:22px 0 8px;font:600 13px/1.4 var(--f-display);letter-spacing:.04em;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:68px minmax(0,1fr) 68px;width:100%;min-height:78px;padding:0;text-align:start;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}
.card:active{background:var(--soft)}
.stub{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;background:var(--stub-bg);color:var(--stub-ink);border-inline-end:2px dashed var(--line)}
.stub b{font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stub i{font-style:normal;font-size:12px;font-weight:600;color:var(--stub-sub);margin-top:3px}
.stub small{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.cbody{display:flex;align-items:center;padding:12px 14px;min-width:0}
.desc{font-weight:500;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.thumb{background:var(--soft);border-inline-start:1px solid var(--line)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}

.note{margin:36px 0;text-align:center;color:var(--muted)}
.empty{margin-top:28px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px}
.empty h2{font:800 20px/1.3 var(--f-display);margin:0 0 6px}
.empty p{margin:0 0 14px;color:var(--muted)}
.empty ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}

.bar{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;gap:10px;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 72%,transparent)}
.bar .btn{flex:1;max-width:300px}
.btn{min-height:50px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:var(--surface);border-color:transparent}
.btn[disabled]{opacity:.6;cursor:default}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:var(--overlay)}
.panel{width:100%;max-width:560px;max-height:94dvh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ph h2{font:800 20px/1.3 var(--f-display);margin:0}
.x{width:40px;height:40px;border:0;border-radius:50%;background:var(--soft);font-size:22px;line-height:1;cursor:pointer}
.imgwrap{background:var(--soft);border-radius:12px;overflow:auto;max-height:42dvh;margin-bottom:6px;text-align:center}
.imgwrap.zoom{max-height:none}
.imgwrap img{display:block;max-width:100%;max-height:42dvh;margin:0 auto;object-fit:contain;cursor:zoom-in}
.imgwrap.zoom img{max-height:none;width:100%;cursor:zoom-out}
.hint{margin:0 0 14px;font-size:13px;color:var(--muted);text-align:center}
label{display:block;margin:10px 0 6px;font-size:14px;font-weight:600}
.field{width:100%;min-height:50px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;font-size:16px}
.field:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.err{margin:12px 0 0;color:var(--danger);font-size:14px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:90vw}
.backup{margin-top:32px;padding-top:18px;border-top:1px dashed var(--line)}
.backup h2{font:800 16px/1.3 var(--f-display);margin:0 0 4px}
.backup p{margin:0 0 12px;color:var(--muted);font-size:14px}
.backup .row{display:flex;gap:10px;flex-wrap:wrap}
.backup .btn{flex:1 1 150px;min-height:46px;font-size:15px}
.bkmsg{margin:10px 0 0;min-height:21px;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
</style>
</head>
<body>


<div id="app" class="wrap" dir="rtl" lang="ar">
  <header class="top">
    <h1>دفتر الوصولات</h1>
    <p class="meta" id="meta" aria-live="polite"></p>
    <label class="search" for="q" style="margin:0;font-weight:400">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="دوّر: شراء، ساعة، نوفمبر…">
      <button id="qx" class="clear" type="button" hidden aria-label="مسح البحث">×</button>
    </label>
  </header>
  <main id="list"></main>
  <section id="backup" class="backup" hidden>
    <h2>نسخة احتياطية</h2>
    <p>نزّل كل الوصولات بصورها في ملف واحد واحتفظ بيه، وارجع منه أي وقت.</p>
    <div class="row">
      <button id="bkSave" class="btn" type="button" hidden>حفظ نسخة احتياطية</button>
      <button id="bkRestore" class="btn" type="button">استرجاع من نسخة</button>
    </div>
    <p id="bkMsg" class="bkmsg" role="status" aria-live="polite"></p>
  </section>
</div>
<input id="fileRestore" type="file" accept=".json,application/json" hidden>

<div class="bar">
  <button id="btnCam" class="btn primary" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    صوّر وصل
  </button>
  <button id="btnPick" class="btn" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 9"/></svg>
    من المعرض
  </button>
</div>
<input id="fileCam" type="file" accept="image/*" capture="environment" hidden>
<input id="filePick" type="file" accept="image/*" hidden>

<div id="sheet" class="sheet" dir="rtl" lang="ar" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="ph"><h2 id="sheetTitle">وصل جديد</h2><button id="close" class="x" type="button" aria-label="إغلاق">×</button></div>
    <div id="imgwrap" class="imgwrap"><img id="pimg" alt="صورة الوصل"></div>
    <p class="hint">اضغط على الصورة عشان تكبّرها</p>
    <label for="desc">الوصف</label>
    <input id="desc" class="field" type="text" maxlength="200" autocomplete="off" placeholder="مثال: شراء ساعة">
    <label for="date">التاريخ</label>
    <input id="date" class="field" type="date">
    <p id="err" class="err" role="alert" hidden></p>
    <div class="actions">
      <button id="save" class="btn primary" type="button">حفظ الوصل</button>
      <button id="del" class="btn danger" type="button" hidden>حذف</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  var LOC='ar-EG-u-nu-latn';
  var fMonth=new Intl.DateTimeFormat(LOC,{month:'long'});
  var fMonthYear=new Intl.DateTimeFormat(LOC,{month:'long',year:'numeric'});
  var AR='٠١٢٣٤٥٦٧٨٩';

  /* Arabic-friendly matching: ساعة / ساعه, أ / ا, ى / ي, tashkeel and Arabic digits all compare equal. */
  function norm(s){
    return String(s==null?'':s).toLowerCase()
      .replace(/[ً-ٰٟـ]/g,'')
      .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
      .replace(/[٠-٩]/g,function(c){return AR.indexOf(c)})
      .trim();
  }
  function parseISO(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null}
  function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

  var state={items:[],q:'',backend:null,loaded:false,error:'',dl:null};

  /* ---------- storage backends ---------- */
  function dbBackend(db,assets,uid){
    var col=db.doc('data/users/'+uid+'/app').collection('receipts');
    return {
      label:'محفوظة على حسابك',
      subscribe:function(next,fail){
        col.onSnapshot(function(snap){
          next(snap.docs.map(function(d){
            var v=d.data()||{};
            return {id:d.id,desc:v.desc||'',date:v.date||'',createdAt:v.createdAt||0,thumb:v.thumb||'',assetId:v.assetId,img:v.assetId?'/_blob/'+v.assetId:''};
          }));
        },fail);
      },
      add:async function(r){
        var up=await assets.upload(r.blob,{type:'image/jpeg'});
        try{
          await col.doc().set({desc:r.desc,date:r.date,createdAt:Date.now(),thumb:r.thumb,assetId:up.id});
        }catch(e){
          try{await assets.delete(up.id)}catch(_){}
          throw e;
        }
      },
      update:async function(it,patch){await col.doc(it.id).update(patch)},
      remove:async function(it){
        await col.doc(it.id).delete();
        if(it.assetId){try{await assets.delete(it.assetId)}catch(_){}}
      }
    };
  }

  function localBackend(){
    var dbp=null,cb=null;
    function open(){
      if(!dbp)dbp=new Promise(function(res,rej){
        var r=indexedDB.open('dafter-elwasolat',1);
        r.onupgradeneeded=function(){r.result.createObjectStore('r',{keyPath:'id'})};
        r.onsuccess=function(){res(r.result)};
        r.onerror=function(){rej(r.error)};
      });
      return dbp;
    }
    async function tx(mode,fn){
      var d=await open();
      return new Promise(function(res,rej){
        var t=d.transaction('r',mode),rq=fn(t.objectStore('r'));
        t.oncomplete=function(){res(rq&&rq.result)};
        t.onerror=t.onabort=function(){rej(t.error)};
      });
    }
    async function push(){if(cb)cb(await tx('readonly',function(s){return s.getAll()}))}
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(_){}
    return {
      label:'محفوظة على الجهاز ده بس',
      subscribe:function(next,fail){cb=next;push().catch(fail)},
      add:async function(r){
        await tx('readwrite',function(s){return s.put({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),desc:r.desc,date:r.date,createdAt:Date.now(),thumb:r.thumb,blob:r.blob})});
        await push();
      },
      update:async function(it,patch){
        await tx('readwrite',function(s){return s.put(Object.assign({},it,patch,{img:undefined}))});
        await push();
      },
      remove:async function(it){await tx('readwrite',function(s){return s.delete(it.id)});await push()}
    };
  }

  /* ---------- images ---------- */
  async function loadBitmap(file){
    if(window.createImageBitmap){
      try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(_){}
    }
    return new Promise(function(res,rej){
      var u=URL.createObjectURL(file),im=new Image();
      im.onload=function(){URL.revokeObjectURL(u);res(im)};
      im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('decode'))};
      im.src=u;
    });
  }
  function scaled(src,max){
    var w=src.width||src.naturalWidth,h=src.height||src.naturalHeight,k=Math.min(1,max/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
    var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);
    return c;
  }
  function toBlob(c,q){return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',q)})}
  async function prepare(file){
    var bmp=await loadBitmap(file);
    var blob=await toBlob(scaled(bmp,1600),0.8);
    var thumb=scaled(bmp,200).toDataURL('image/jpeg',0.6);
    if(bmp.close)try{bmp.close()}catch(_){}
    return {blob:blob,thumb:thumb};
  }

  /* ---------- list ---------- */
  function decorate(it){
    var d=parseISO(it.date)||new Date(it.createdAt||Date.now());
    var hay=norm([it.desc,fMonth.format(d),d.getFullYear(),d.getDate(),it.date].join(' '));
    return {it:it,d:d,hay:hay};
  }
  function render(){
    var list=$('#list'),meta=$('#meta');
    list.textContent='';
    $('#backup').hidden=!state.loaded||!!state.error;
    $('#bkSave').hidden=!state.dl||!state.items.length;
    if(state.error){meta.textContent='';list.append(el('p','note',state.error));return}
    if(!state.loaded){meta.textContent='بحمّل الوصولات…';return}
    var tokens=norm(state.q).split(/\s+/).filter(Boolean);
    var all=state.items.map(decorate).sort(function(a,b){
      return (b.d-a.d)||((b.it.createdAt||0)-(a.it.createdAt||0));
    });
    var rows=all.filter(function(r){return tokens.every(function(t){return r.hay.indexOf(t)>-1})});
    if(!all.length){meta.textContent='';list.append(emptyState());return}
    meta.textContent=(tokens.length?rows.length+' من '+all.length:all.length)+' وصل';
    if(!rows.length){list.append(el('p','note','مفيش وصل بيطابق «'+state.q.trim()+'». جرّب كلمة تانية، زي اسم الحاجة أو الشهر.'));return}
    var key='',cards=null;
    rows.forEach(function(r){
      var k=r.d.getFullYear()+'-'+r.d.getMonth();
      if(k!==key){key=k;list.append(el('h2','month',fMonthYear.format(r.d)));cards=el('div','cards');list.append(cards)}
      cards.append(card(r));
    });
  }
  function card(r){
    var b=el('button','card');b.type='button';b.dataset.id=r.it.id;
    var stub=el('span','stub');
    stub.append(el('b',null,String(r.d.getDate())),el('i',null,fMonth.format(r.d)),el('small',null,String(r.d.getFullYear())));
    var body=el('span','cbody');body.append(el('span','desc',r.it.desc||'بدون وصف'));
    var th=el('span','thumb');
    if(r.it.thumb){var im=el('img');im.src=r.it.thumb;im.alt='';im.loading='lazy';th.append(im)}
    b.append(stub,body,th);
    return b;
  }
  function emptyState(){
    var d=el('section','empty');
    d.append(el('h2',null,'مفيش وصولات لسه'));
    d.append(el('p',null,'صوّر أول وصل وهيظهر هنا، وتقدر تدوّر عليه بعد كده في ثواني.'));
    var ol=el('ol');
    ['دوس «صوّر وصل» وصوّر الوصل اللي في إيدك.','اكتب وصف بسيط، زي «شراء ساعة».','اختار التاريخ ودوس حفظ.'].forEach(function(t){ol.append(el('li',null,t))});
    d.append(ol);
    return d;
  }

  /* ---------- sheet ---------- */
  var sh={mode:null,item:null,pending:null,url:null,busy:false,armTimer:0};
  function err(m){var e=$('#err');e.hidden=!m;e.textContent=m||''}
  function setBusy(b){sh.busy=b;$('#save').disabled=b;$('#del').disabled=b;$('#close').disabled=b;if(b)$('#save').textContent='بحفظ…';else $('#save').textContent=sh.mode==='add'?'حفظ الوصل':'حفظ التعديل'}
  function disarm(){clearTimeout(sh.armTimer);var d=$('#del');d.classList.remove('armed');d.textContent='حذف'}
  function openSheet(mode,item,pending){
    sh.mode=mode;sh.item=item||null;sh.pending=pending||null;
    $('#imgwrap').classList.remove('zoom');err('');disarm();
    if(sh.url){URL.revokeObjectURL(sh.url);sh.url=null}
    var src='';
    if(mode==='add'){sh.url=URL.createObjectURL(pending.blob);src=sh.url}
    else if(item.img){src=item.img}
    else if(item.blob){sh.url=URL.createObjectURL(item.blob);src=sh.url}
    $('#pimg').src=src;
    $('#sheetTitle').textContent=mode==='add'?'وصل جديد':'تفاصيل الوصل';
    $('#desc').value=mode==='add'?'':item.desc;
    $('#date').value=mode==='add'?todayISO():item.date;
    $('#del').hidden=mode==='add';
    setBusy(false);
    $('#sheet').hidden=false;document.body.style.overflow='hidden';
    if(mode==='add')setTimeout(function(){$('#desc').focus()},60);
  }
  function closeSheet(){
    if(sh.busy)return;
    $('#sheet').hidden=true;document.body.style.overflow='';disarm();
    if(sh.url){URL.revokeObjectURL(sh.url);sh.url=null}
    $('#pimg').removeAttribute('src');sh.mode=null;sh.item=null;sh.pending=null;
  }
  function msgFor(e){
    var c=e&&e.code;
    if(c==='quota_or_state'||c==='quota_exceeded')return 'المساحة المتاحة خلصت. امسح وصولات قديمة وجرّب تاني.';
    if(c==='too_large')return 'الصورة كبيرة قوي. جرّب صورة تانية.';
    if(c==='rate_limited'||c==='resource_exhausted')return 'استنى ثواني وجرّب تاني.';
    return 'معرفناش نحفظ الوصل. اتأكد من النت وجرّب تاني.';
  }
  var toastTimer=0;
  function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},2200)}

  async function save(){
    if(sh.busy||!state.backend)return;
    var desc=$('#desc').value.trim(),date=$('#date').value;
    if(!desc){err('اكتب وصف بسيط للوصل، زي «شراء ساعة».');$('#desc').focus();return}
    if(!parseISO(date)){err('اختار تاريخ الوصل.');return}
    err('');setBusy(true);
    try{
      if(sh.mode==='add'){
        await state.backend.add({desc:desc,date:date,blob:sh.pending.blob,thumb:sh.pending.thumb});
        toast('اتحفظ الوصل');
      }else if(desc!==sh.item.desc||date!==sh.item.date){
        await state.backend.update(sh.item,{desc:desc,date:date});
        toast('اتحفظ التعديل');
      }
      setBusy(false);closeSheet();
    }catch(e){setBusy(false);err(msgFor(e))}
  }
  async function del(){
    if(sh.busy||!sh.item)return;
    var d=$('#del');
    if(!d.classList.contains('armed')){
      d.classList.add('armed');d.textContent='دوس تاني للتأكيد';
      sh.armTimer=setTimeout(disarm,4000);return;
    }
    clearTimeout(sh.armTimer);setBusy(true);
    try{await state.backend.remove(sh.item);setBusy(false);closeSheet();toast('اتمسح الوصل')}
    catch(e){setBusy(false);disarm();err('معرفناش نمسح الوصل. جرّب تاني.')}
  }

  async function onFile(file){
    if(!file||!state.backend)return;
    try{
      var p=await prepare(file);
      openSheet('add',null,p);
    }catch(e){toast('معرفناش نقرا الصورة دي. جرّب صورة تانية.')}
  }

  /* ---------- backup / restore ---------- */
  var bkBusy=false;
  function setBk(msg,busy){
    bkBusy=!!busy;$('#bkMsg').textContent=msg||'';
    $('#bkSave').disabled=bkBusy;$('#bkRestore').disabled=bkBusy;
  }
  function blobToDataURL(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.readAsDataURL(b)})}
  function dataURLToBlob(u){
    var m=/^data:([^;,]+)?(;base64)?,(.*)$/.exec(u||'');if(!m||!m[2])throw new Error('format');
    var bin=atob(m[3]),a=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
    return new Blob([a],{type:m[1]||'image/jpeg'});
  }
  function urlToBlob(url){
    return new Promise(function(res,rej){
      var im=new Image();
      im.onload=function(){toBlob(scaled(im,2400),0.85).then(res,rej)};
      im.onerror=function(){rej(new Error('img'))};
      im.src=url;
    });
  }
  async function backup(){
    if(bkBusy||!state.dl||!state.items.length)return;
    var items=state.items.slice();
    try{
      var out=[];
      for(var i=0;i<items.length;i++){
        setBk('بجهّز النسخة… '+(i+1)+' من '+items.length,true);
        var it=items[i],blob=it.blob||await urlToBlob(it.img);
        out.push({desc:it.desc,date:it.date,createdAt:it.createdAt,thumb:it.thumb,image:await blobToDataURL(blob)});
      }
      var file=new Blob([JSON.stringify({app:'dafter-elwasolat',version:1,exportedAt:new Date().toISOString(),receipts:out})],{type:'application/json'});
      await state.dl.save({filename:'receipts-backup-'+todayISO()+'.json',data:file});
      setBk('اتحفظت النسخة الاحتياطية. خلّي الملف في مكان تاني غير الموبايل كمان.',false);
    }catch(e){
      setBk(e&&e.code==='declined'?'':'معرفناش نعمل النسخة الاحتياطية. جرّب تاني.',false);
    }
  }
  async function restore(file){
    if(bkBusy||!file||!state.backend)return;
    setBk('بقرا الملف…',true);
    try{
      var data=JSON.parse(await file.text());
      var list=data&&data.app==='dafter-elwasolat'&&Array.isArray(data.receipts)?data.receipts:null;
      if(!list)throw new Error('format');
      var have={};
      state.items.forEach(function(x){have[x.date+'|'+x.desc+'|'+x.thumb]=1});
      var added=0,skipped=0;
      for(var i=0;i<list.length;i++){
        var r=list[i];
        if(!r||!parseISO(r.date)||!r.image||have[r.date+'|'+r.desc+'|'+(r.thumb||'')]){skipped++;continue}
        setBk('برجّع الوصولات… '+(i+1)+' من '+list.length,true);
        await state.backend.add({desc:String(r.desc||'').slice(0,200),date:r.date,blob:dataURLToBlob(r.image),thumb:r.thumb||''});
        added++;
      }
      setBk('رجّعنا '+added+' وصل'+(skipped?' وتخطّينا '+skipped+' لأنهم موجودين أصلاً.':'.'),false);
    }catch(e){
      var bad=e instanceof SyntaxError||(e&&e.message==='format');
      setBk(bad?'الملف ده مش نسخة احتياطية من التطبيق.':msgFor(e),false);
    }
  }

  /* ---------- wiring ---------- */
  $('#bkSave').addEventListener('click',backup);
  $('#bkRestore').addEventListener('click',function(){if(!bkBusy)$('#fileRestore').click()});
  $('#fileRestore').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];e.target.value='';restore(f)});
  $('#btnCam').addEventListener('click',function(){$('#fileCam').click()});
  $('#btnPick').addEventListener('click',function(){$('#filePick').click()});
  ['#fileCam','#filePick'].forEach(function(s){
    $(s).addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];e.target.value='';onFile(f)});
  });
  $('#q').addEventListener('input',function(e){state.q=e.target.value;$('#qx').hidden=!state.q;render()});
  $('#qx').addEventListener('click',function(){$('#q').value='';state.q='';$('#qx').hidden=true;render();$('#q').focus()});
  $('#list').addEventListener('click',function(e){
    var c=e.target.closest('.card');if(!c)return;
    var it=state.items.filter(function(x){return x.id===c.dataset.id})[0];
    if(it)openSheet('edit',it);
  });
  $('#close').addEventListener('click',closeSheet);
  $('#sheet').addEventListener('click',function(e){if(e.target.id==='sheet')closeSheet()});
  $('#imgwrap').addEventListener('click',function(){$('#imgwrap').classList.toggle('zoom')});
  $('#save').addEventListener('click',save);
  $('#del').addEventListener('click',del);
  $('#desc').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();save()}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

  /* ---------- native saver (APK): save a file through the Android share sheet ---------- */
  function nativeSaver(){
    return {
      save:async function(req){
        var C=window.Capacitor,P=C&&C.Plugins;
        var blob=req.data instanceof Blob?req.data:new Blob([req.data]);
        if(C&&C.isNativePlatform&&C.isNativePlatform()&&P&&P.Filesystem&&P.Share){
          var b64=(await blobToDataURL(blob)).split(',')[1];
          await P.Filesystem.writeFile({path:req.filename,data:b64,directory:'CACHE'});
          var u=await P.Filesystem.getUri({path:req.filename,directory:'CACHE'});
          try{await P.Share.share({title:req.filename,files:[u.uri]})}
          catch(e){if(/cancel/i.test(String(e&&e.message||e)))throw {code:'declined'};throw e}
          return {status:'saved'};
        }
        var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=req.filename;
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
        return {status:'saved'};
      }
    };
  }

  /* ---------- boot ---------- */
  async function boot(){
    render();
    var timer=setTimeout(function(){if(!state.loaded)$('#meta').textContent='لسه بحاول أوصل للوصولات…'},10000);
    var b=null;
    try{
      var c=window.claude;
      if(c&&c.use){
        var race=function(p){return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null)},6000)})])};
        var r=await Promise.all([race(c.use('db')),race(c.use('assets')),race(c.use('user')),race(c.use('downloads'))]);
        state.dl=r[3]||null;
        var uid=r[2]?await r[2].id():null;
        if(r[0]&&r[1]&&uid)b=dbBackend(r[0],r[1],uid);
      }
    }catch(_){}
    if(!b)b=localBackend();
    if(!state.dl)state.dl=nativeSaver();
    state.backend=b;
    b.subscribe(function(items){clearTimeout(timer);state.items=items;state.loaded=true;state.error='';render()},
      function(){clearTimeout(timer);state.loaded=true;state.error='مقدرناش نفتح الوصولات المحفوظة. اعمل ريفريش للصفحة وجرّب تاني.';render()});
  }
  boot();
})();
</script>
